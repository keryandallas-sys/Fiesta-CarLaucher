name: Build Fiesta Car Launcher

on:
  push:
    paths:
      - 'Fiesta-CarLauncher-adapte.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q Fiesta-CarLauncher-adapte.zip
          cd CarLauncher
          chmod +x gradlew

      - name: Build APK
        working-directory: CarLauncher
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fiesta-CarLauncher-APK
          path: CarLauncher/app/build/outputs/apk/debug/*.apk
